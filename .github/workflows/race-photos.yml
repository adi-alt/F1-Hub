name: Race photos

# Finds Wikimedia Commons photo candidates for recent races and re-checks the approved ones (pipeline/
# race_photos.py). It never publishes a photo: candidates wait for a person on /admin/race-photos.
#
# Three times a week: Saturday 22:00 UTC (after qualifying, for practice and qualifying photos of this weekend's
# race), Monday 06:00 (race-day uploads) and Thursday 06:00 (the late trickle). A race is revisited for five
# weeks. The re-check removes any approved photo that was deleted from Commons or whose licence no longer passes
# the allow-list.
#
# Production is on by default: set the repository variable RACE_PHOTOS_PRODUCTION to "false" to pause the
# schedule. (It used to be opt-in, the variable was never set, and every scheduled run was skipped.) A manual
# run can target staging (the staging environment's database) or production (main only). The staging target
# only works while a staging project exists (STAGING_ENABLED).
on:
  schedule:
    - cron: "0 22 * * 6"
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      target:
        description: "Which database"
        type: choice
        options: [staging, production]
        default: staging
      race:
        description: "One race: its id or title, e.g. 2026 Australian Grand Prix (empty = this weekend and the last 5 weeks)"
        type: string
        default: ""
      mode:
        description: "scan finds candidates; recheck re-verifies approved photos"
        type: choice
        options: [scan, recheck, both]
        default: scan

concurrency:
  group: race-photos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # A fork's pull request gets no secrets, and shouldn't be trusted with staging anyway.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Refuse anything but the staging project
        run: |
          case "$DATABASE_URL" in *wmdgbmlpvszyapewygvs*) echo "staging database";; *) echo "DATABASE_URL is not staging"; exit 1;; esac
      # Wikimedia asks API clients to cache: category listings and file metadata are reused for six hours.
      - uses: actions/cache@v4
        with:
          path: pipeline/f1_cache/wikimedia
          key: wikimedia-${{ github.run_id }}
          restore-keys: wikimedia-
      - name: Scan
        if: inputs.mode != 'recheck'
        working-directory: pipeline
        # Through the environment, never interpolated into the script (no shell injection from the input).
        env:
          RACE: ${{ inputs.race }}
        run: python race_photos.py ${RACE:+--race "$RACE"}
      - name: Re-check approved photos
        if: inputs.mode != 'scan'
        working-directory: pipeline
        run: python race_photos.py --recheck

  production:
    if: >-
      (github.event_name == 'schedule' && vars.RACE_PHOTOS_PRODUCTION != 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Busts the race-photos cache when the re-check removed or updated a photo.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: pipeline/f1_cache/wikimedia
          key: wikimedia-${{ github.run_id }}
          restore-keys: wikimedia-
      - name: Scan
        if: github.event_name == 'schedule' || inputs.mode != 'recheck'
        working-directory: pipeline
        # Through the environment, never interpolated into the script (no shell injection from the input).
        env:
          RACE: ${{ inputs.race }}
        run: python race_photos.py ${RACE:+--race "$RACE"}
      - name: Re-check approved photos
        if: github.event_name == 'schedule' || inputs.mode != 'scan'
        working-directory: pipeline
        run: python race_photos.py --recheck
      # Tells the site's admins when photos are waiting to be chosen (/api/cron/emails); nothing when none are.
      - name: Tell admins about new photos
        if: github.event_name == 'schedule' || inputs.mode != 'recheck'
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.apexf1hub.com' }}
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/cron/emails" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{"job":"photos-ready"}'
