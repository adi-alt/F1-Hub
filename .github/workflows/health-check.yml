name: Health check

# The freshness alarm (audit R-52): polls /api/health every 30 minutes and fails - which GitHub emails to the repo's
# watchers - when the site reports itself degraded (a stale pipeline job, a failure streak, or no database). The
# endpoint answers 503 when degraded, and the job prints its `problems` so the alert says why.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll /api/health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.apexf1hub.com' }}
        run: |
          status=$(curl -sS -o health.json -w '%{http_code}' --max-time 30 --retry 2 --retry-all-errors "$APP_BASE_URL/api/health" || echo 000)
          cat health.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            problems=$(jq -r '.problems // [] | join("; ")' health.json 2>/dev/null || true)
            echo "::error title=Site data is stale or unhealthy::HTTP $status. ${problems:-no response body}"
            exit 1
          fi
