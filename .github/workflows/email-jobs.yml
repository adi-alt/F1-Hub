name: Email jobs

# The race-weekend emails people turn on in Settings › Notifications (src/lib/raceWeekendEmails.ts): every hour,
# a reminder to whoever still has picks open in the 3 hours before qualifying locks them, and once a race is over
# and its rounds are settled, how their picks did. The site does the work (/api/cron/emails, behind CRON_SECRET);
# each email goes once per person per race, so a missed or repeated run sends nothing twice. The same call retries
# notification emails that failed to send (up to 5 tries, backing off 1h/2h/4h/8h; failures logged on the row).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-jobs
  cancel-in-progress: false

jobs:
  race-weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send race-weekend emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.apexf1hub.com' }}
        run: |
          curl --fail-with-body -sS -X POST "$APP_BASE_URL/api/cron/emails" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{"job":"race-weekend"}'
