name: Browser tests

# Playwright against the real app (audit R-21): the app is built and started in the job and driven in a
# real browser. It checks what the audit made acceptance criteria: axe finds no serious or critical issues
# on the key routes (signed in and out, desktop and phone), the sign-in dialog works by keyboard alone, and
# no key route scrolls sideways at 320 and 390px.
#
# `e2e` runs on every pull request with no secrets at all: the app is backed by a DISPOSABLE Postgres
# (service container) loaded with the repo's schema, migrations, deterministic reference data and the
# synthetic users (scripts/local-db/load.ts), served through PostgREST behind a small Supabase stand-in
# (scripts/local-db/supabase.mjs). `e2e-staging` is the same suite against the staging project, only while
# one exists (vars.STAGING_ENABLED, see migrate.yml). See e2e/README.md.
#
# Tests sign in by minting the app's own session cookie for a seeded user with a SESSION_SECRET that exists
# only for this run, and AI routes are blocked in the browser, so a test can never reach production or
# trigger a model call.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Rewrite the visual baselines from this run (download the visual-baselines artifact and commit it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # Starts before the schema exists and retries its connection; load.ts ends with NOTIFY pgrst so it
      # reloads its schema cache once the tables are there. The JWT secret is the test-only constant in
      # scripts/local-db/supabase.mjs.
      postgrest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: apex-local-only-jwt-secret-not-used-anywhere-real
        ports: ["3000:3000"]
    env:
      E2E_LOCAL: "1"
      LOCAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SESSION_SECRET: e2e-${{ github.run_id }}-session-secret-for-this-run-only
      CRON_SECRET: e2e-only
      # Serves /dev/ui in this production build so every primitive can be snapshotted and axe-checked
      # (e2e/design-system.spec.ts). Never set on Vercel.
      UI_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load the disposable database
        run: npx tsx scripts/local-db/load.ts
      - name: Point the app at it
        run: node scripts/local-db/supabase.mjs --env >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      # Any visual baseline this run had to write (a new primitive section, or the first run on Linux). Commit
      # these files to make them the baseline; the next run then compares against them.
      - name: Keep new visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-staging:
    # Runs against the staging database, so off while there is none. A fork's pull request gets no secrets
    # and is skipped.
    if: vars.STAGING_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SESSION_SECRET: e2e-${{ github.run_id }}-session-secret-for-this-run-only
      CRON_SECRET: e2e-only
      UI_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: |
            test-results/
            playwright-report/
          retention-days: 7
