name: Browser tests

# Playwright against the real app (audit R-21): the app is built and started in the job, backed by the
# STAGING database and its synthetic users (scripts/staging/seed.mjs), and driven in a real browser.
# It checks what the audit made acceptance criteria: axe finds no serious or critical issues on the key
# routes (signed in and out, desktop and phone), the sign-in dialog works by keyboard alone, and no key
# route scrolls sideways at 320 and 390px.
#
# Reads from staging only. Tests sign in by minting the app's own session cookie for a seeded user with a
# SESSION_SECRET that exists only for this run, and AI routes are blocked in the browser, so a test can
# never reach production or trigger a model call. A fork's pull request gets no secrets and is skipped.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SESSION_SECRET: e2e-${{ github.run_id }}-session-secret-for-this-run-only
      CRON_SECRET: e2e-only
      NVIDIA_API_KEY: e2e-no-model-calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
