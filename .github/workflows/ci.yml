name: CI

# On every push/PR, not on a schedule — this checks code changes, unrelated to the data pipeline's
# clock-based workflows (fetch-races.yml, sync-calendar.yml).
on:
  push:
  pull_request:

# Read-only: nothing here writes to the repository (audit SEC-18).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Counts the class patterns the design tokens replace (text-[Npx], [var(--x)], [#hex],
      # outline-none without focus-visible) and fails if any grows past scripts/design-lint-baseline.json.
      - run: npm run lint:design
      - run: npm test

      # Placeholders, not the real secrets (audit SEC-18): the build only needs values that are set
      # and parse, and nothing that runs during `npm ci` or the build - including a compromised
      # dependency - should be able to read production credentials. Vercel builds the deployed app
      # with its own environment.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          SUPABASE_SECRET_KEY: placeholder-secret-key
          CRON_SECRET: placeholder-cron-secret
          SESSION_SECRET: placeholder-session-secret-for-ci-builds-only-000000
          NVIDIA_API_KEY: placeholder-nvidia-key

  # Separate job, not a step in `build`: these are plain-assert Python scripts (no pytest, see
  # their own docstrings) that were previously never run by anything - a real gap, since it's what
  # let 2026 round 14's wrong-meeting/premature-classification bug (see
  # pipeline/OPENF1_FALLBACK.md) ship silently. Independent of the Node job so a pipeline-only PR
  # doesn't need to touch the frontend to get checked, and vice versa.
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Data-consistency and pipeline unit tests
        working-directory: pipeline
        run: |
          python test_fetch_races.py
          python test_race_identity.py
          python test_official_sources.py
          python test_compute_group_scores.py
