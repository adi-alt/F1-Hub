name: Circuit track maps

# Sets each circuit's track map (its Wikipedia article's free lead image, credited from Commons) on
# archive_circuits (pipeline/circuit_track_maps.py). A map that no longer passes the licence and attribution
# checks is cleared. Manual only, production only, from main.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be stored, write nothing"
        type: boolean
        default: true

concurrency:
  group: circuit-track-maps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Busts the archive-data cache when a map was stored or cleared.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: pipeline/f1_cache/wikimedia
          key: wikimedia-${{ github.run_id }}
          restore-keys: wikimedia-
      - name: Track maps
        working-directory: pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python circuit_track_maps.py --dry-run; else python circuit_track_maps.py; fi
