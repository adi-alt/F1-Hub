name: Race track stories

# Builds each completed race's real circuit outline and lead-change locations from F1's live-timing archive
# into race_track_stories (pipeline/race_track_story.py), for the race page's "How the race unfolded".
# Needs the 20261013_race_track_stories migration applied first. Manual only, production only, from main;
# a dry run by default. Repeatable: each run does the races still missing a story, newest first.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and report each story, write nothing"
        type: boolean
        default: true
      since:
        description: "First season; empty = the current one (only the current season's race pages show stories)"
        type: string
        default: ""
      limit:
        description: "At most this many races in this run"
        type: string
        default: "25"

concurrency:
  group: race-track-stories
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Busts the races cache once stories are stored, so race pages show them straight away.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Track stories
        working-directory: pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SINCE: ${{ inputs.since }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # Numbers only: the inputs reach the command line.
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] || { echo "limit must be a number"; exit 1; }
          [[ -z "$SINCE" || "$SINCE" =~ ^20[0-9]{2}$ ]] || { echo "since must be a year"; exit 1; }
          args="--backfill --limit $LIMIT"
          if [ -n "$SINCE" ]; then args="$args --since $SINCE"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python race_track_story.py $args
