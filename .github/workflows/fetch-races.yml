name: Fetch race data

# Every few hours, not on every commit or PR — this is a data pipeline on a clock, unrelated to
# code changes. workflow_dispatch is here so it can be triggered manually to cross-check it works.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch current season (no year/round hardcoded — always "whatever's current")
        run: python pipeline/fetch_races.py
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
