name: Fetch race data and predict

# Every 15 minutes, not on every commit or PR — this is a data/ML pipeline on a clock, unrelated
# to code changes. Frequent by design: fetch_races.py's own next_relevant_round() gate makes most
# of these ticks cost one cheap Postgres query and exit (no FastF1 calls at all) whenever no race
# weekend is within its fetch window - see that function's docstring. This is what actually
# delivers "near-live during a session, near-zero cost otherwise" without needing a second,
# differently-scheduled workflow: the frequency lives here, the "is it actually worth doing
# anything expensive right now" decision lives in the script. Repo is public, so GitHub Actions
# minutes are unmetered - no cost concern to running this often.
#
# workflow_dispatch's force_all_rounds input preserves the old "fetch every remaining round"
# behavior for manual use (bulk catch-up after an outage, re-checking an older round) - the
# automated schedule never sets it, so a normal tick only ever touches the one round that's
# actually due.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_all_rounds:
        description: "Fetch every remaining round this season, not just the one currently due (bulk catch-up/manual re-check only)"
        type: boolean
        default: false

# One run at a time, queued rather than cancelled: a 15-minute tick can outlast the next one, and a
# manual dispatch can land mid-run. Overlapping runs already converge on one row per event (race ids
# are resolved from stored rows and every write is a primary-key upsert - see race_identity.py); this
# just stops two runs from doing the same FastF1 work, or racing to the same writes, in the first place.
concurrency:
  group: fetch-races
  cancel-in-progress: false

# The job reads the repo and nothing else: every write goes through the database and Storage secrets.
permissions:
  contents: read

jobs:
  fetch-and-predict:
    runs-on: ubuntu-latest
    # A hung FastF1/OpenF1 call otherwise holds the one-at-a-time queue (and a runner) for six hours,
    # and every later tick waits behind it. A normal tick takes minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch current season (no year/round hardcoded — always "whatever's current")
        run: python pipeline/fetch_races.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Failures go to Sentry; unset means they just stay in the job log and the pipeline_runs ledger.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Needed now: driver headshots/team logos/race photos get re-hosted into Supabase
          # Storage as part of this step (see ergast_utils.fetch_and_upload_media), which talks
          # to Storage's REST API directly, not through DATABASE_URL.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Without this, ergast_utils.trigger_revalidation("races") silently no-ops (it's
          # deliberately best-effort - see its own docstring) and the Next.js data cache
          # (unstable_cache with revalidate: false in src/lib/supabase/races.ts) never learns a
          # race actually finished, serving the pre-race snapshot indefinitely. This is exactly
          # the bug that left a completed race showing as not-yet-run - was previously missing
          # from every step here that calls trigger_revalidation.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Only ever true on a manual workflow_dispatch run - github.event.inputs doesn't exist
          # on a schedule-triggered run, so this expression evaluates empty/false on every
          # automated tick rather than erroring.
          FORCE_ALL_ROUNDS: ${{ github.event.inputs.force_all_rounds }}

      # Deliberately a second step in the same job, not a separate workflow: predictions are
      # meaningless without this run's freshly-fetched data, and running both in one job on one
      # schedule guarantees that ordering for free — no cross-workflow coordination needed.
      #
      # Runs even when the fetch step failed (not when the run was cancelled): fetch_races.py exits
      # non-zero on a race identity conflict so a person looks at it (see race_identity.py), and that
      # one round must not also stop predictions and scoring for everything else. This step and the
      # next only read what is already committed and are idempotent.
      - name: Train and freeze predictions for anything newly ready
        if: ${{ !cancelled() }}
        run: python pipeline/train_predict.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Failures go to Sentry; unset means they just stay in the job log and the pipeline_runs ledger.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Also calls trigger_revalidation("races") on its own - same reasoning as above.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Depends only on the results this same run's first step just fetched, not on train_predict's
      # ML output — ordered after it anyway since there's no reason to run before results exist.
      - name: Score group picks for any race that now has a real result
        if: ${{ !cancelled() }}
        run: python pipeline/compute_group_scores.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Failures go to Sentry; unset means they just stay in the job log and the pipeline_runs ledger.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # A smoke alarm, not a transaction guard: this step's own nonzero exit turns this job red in
      # the Actions tab within 15 minutes of a bad write landing, rather than waiting for a user to
      # spot a wrong winner in the UI (see pipeline/audit_data_consistency.py's own docstring for
      # exactly what shapes it checks - the 2026 round 14 corruption is the case this exists for).
      # Deliberately last and does not roll back anything the steps above already wrote. Runs even
      # if an earlier step failed - that is exactly when the alarm matters most.
      - name: Audit data consistency
        if: ${{ !cancelled() }}
        run: python pipeline/audit_data_consistency.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Failures go to Sentry; unset means they just stay in the job log and the pipeline_runs ledger.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
