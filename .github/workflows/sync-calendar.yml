name: Sync season calendar

# Daily, not every-few-hours like fetch-races. The schedule itself almost never changes once
# announced; the daily run is for the race-week weather forecast (R-74), which weather_forecast.py
# only fetches within 5 days of a race, so outside race week a run changes nothing.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# One run at a time (a manual dispatch overlapping the weekly schedule), queued, never cancelled mid-write.
concurrency:
  group: sync-calendar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Sync current year's calendar (no year hardcoded)
        run: python pipeline/sync_calendar.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Failures go to Sentry; unset means they just stay in the job log and the pipeline_runs ledger.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Same gap as fetch-races.yml: sync_calendar.py calls
          # ergast_utils.trigger_revalidation("calendar"), which silently no-ops without this.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
