<!doctype html>
<!-- The share card's picture (public/og-image.png), 1200x630. Rendered by scripts/og/render.mjs; edit here, then
     re-run it. The miniatures carry no names or numbers, so nothing on the card reads as real (or stale) data. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        font-family: "Geist", system-ui, sans-serif; color: #f2f2f3;
        background:
          radial-gradient(620px 420px at 8% 108%, rgba(225, 6, 0, 0.34), transparent 70%),
          radial-gradient(560px 380px at 96% -6%, rgba(54, 113, 198, 0.22), transparent 70%),
          #0b0b0d;
      }
      /* heyclicky's dot grid, faint */
      body::before {
        content: ""; position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px);
        background-size: 28px 28px;
      }
      .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 510px; display: flex; flex-direction: column; justify-content: center; }
      .mark { width: 112px; height: 75px; }
      h1 { margin-top: 28px; font-size: 76px; line-height: 1; font-weight: 600; letter-spacing: -0.035em; }
      .lead { text-wrap: balance; margin-top: 22px; font-size: 26px; line-height: 1.38; color: #b4b4bc; letter-spacing: -0.005em; }
      .url { position: absolute; left: 72px; bottom: 52px; font-size: 22px; color: #8a8a94; letter-spacing: 0.01em; }
      .url b { color: #f2f2f3; font-weight: 500; }

      .win {
        position: absolute; border-radius: 16px; background: rgba(28, 28, 32, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 15px; color: #8a8a94; }
      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
      .bar span { margin-left: 6px; }
      .body { padding: 18px; }
    </style>
  </head>
  <body>
    <div class="left">
      <svg class="mark" viewBox="0 0 46 31" fill="none">
        <g stroke="#f2f2f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 26 L17 8 L28 26" />
          <path d="M10.5 19 L40 19" />
        </g>
        <circle cx="41" cy="19" r="3.4" fill="#e10600" />
      </svg>
      <h1>Apex F1 Hub</h1>
      <p class="lead">Live results, predictions with friends, an AI race analyst and every Grand Prix since 1950.</p>
    </div>
    <p class="url"><b>apexf1hub.com</b></p>

    <!-- Season: standings bars in team colours -->
    <div class="win" style="left: 700px; top: 64px; width: 330px; transform: rotate(-2deg)">
      <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>Season</span></div>
      <div class="body">
        <svg viewBox="0 0 294 132" width="294" height="132">
          <g>
            <rect x="0" y="4" width="280" height="16" rx="5" fill="#ff8000" />
            <rect x="0" y="26" width="248" height="16" rx="5" fill="#3671c6" />
            <rect x="0" y="48" width="214" height="16" rx="5" fill="#27f4d2" />
            <rect x="0" y="70" width="176" height="16" rx="5" fill="#e8002d" />
            <rect x="0" y="92" width="132" height="16" rx="5" fill="#229971" />
            <rect x="0" y="114" width="96" height="16" rx="5" fill="#6692ff" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Race replay: the circuit with cars on it -->
    <div class="win" style="left: 812px; top: 262px; width: 340px; transform: rotate(2.5deg)">
      <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>Race replay</span></div>
      <div class="body" style="padding: 14px 18px 18px">
        <svg viewBox="0 0 200 120" width="304" height="182">
          <path id="t" d="M30 92 C 14 92, 10 70, 22 58 L 70 22 C 82 13, 100 14, 108 26 L 120 46 C 126 56, 140 58, 150 50 L 166 38 C 182 27, 196 44, 186 60 L 170 88 C 162 101, 150 104, 136 104 Z" fill="none" stroke="#2e2e35" stroke-width="13" stroke-linejoin="round" />
          <path d="M30 92 C 14 92, 10 70, 22 58 L 70 22 C 82 13, 100 14, 108 26 L 120 46 C 126 56, 140 58, 150 50 L 166 38 C 182 27, 196 44, 186 60 L 170 88 C 162 101, 150 104, 136 104 Z" fill="none" stroke="#f2f2f3" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round" />
          <circle cx="70" cy="22" r="6" fill="#ff8000" stroke="#0b0b0d" stroke-width="2" />
          <circle cx="54" cy="34" r="6" fill="#3671c6" stroke="#0b0b0d" stroke-width="2" />
          <circle cx="40" cy="45" r="6" fill="#27f4d2" stroke="#0b0b0d" stroke-width="2" />
          <circle cx="160" cy="43" r="6" fill="#e8002d" stroke="#0b0b0d" stroke-width="2" />
        </svg>
      </div>
    </div>

    <!-- Predict: a podium of picks -->
    <div class="win" style="left: 622px; top: 368px; width: 232px; transform: rotate(-1.5deg)">
      <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>Predict</span></div>
      <div class="body">
        <svg viewBox="0 0 196 118" width="196" height="118">
          <rect x="68" y="20" width="60" height="98" rx="8" fill="#26262c" />
          <rect x="2" y="48" width="60" height="70" rx="8" fill="#202026" />
          <rect x="134" y="66" width="60" height="52" rx="8" fill="#1c1c21" />
          <circle cx="98" cy="8" r="7" fill="#ff8000" />
          <circle cx="32" cy="36" r="7" fill="#3671c6" />
          <circle cx="164" cy="54" r="7" fill="#27f4d2" />
          <text x="98" y="78" text-anchor="middle" font-family="Geist" font-size="22" font-weight="600" fill="#f2f2f3">1</text>
          <text x="32" y="92" text-anchor="middle" font-family="Geist" font-size="20" font-weight="600" fill="#b4b4bc">2</text>
          <text x="164" y="100" text-anchor="middle" font-family="Geist" font-size="18" font-weight="600" fill="#8a8a94">3</text>
        </svg>
      </div>
    </div>
  </body>
</html>
